name: Kurse aktualisieren

on:
  schedule:
    # Werktags alle 15 Minuten von 07:00 bis 17:59 UTC
    # = 08:00-18:59 Uhr Winterzeit / 09:00-19:59 Uhr Sommerzeit (Xetra: 09:00-17:30)
    - cron: "*/15 7-17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurse abrufen
        run: python scripts/update.py
      - name: Aenderungen speichern
        run: |
          git config user.name "depot-bot"
          git config user.email "depot-bot@users.noreply.github.com"
          git add data/portfolio.json data/holdings.json
          git diff --cached --quiet || git commit -m "Kurse $(date -u +%F_%H:%M)"
          git push
